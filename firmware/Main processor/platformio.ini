; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs    = esp32dev-serial
extra_configs   =
  ../version.ini

[common]
build_flags     =
    -DPRODUCT_VERSION=\"${meta.product_version}\"
    -DCLI_MAX_COMMANDS=32
    -DCLI_INPUT_BUFFER_SIZE=256
    -DCORE_DEBUG_LEVEL=0
platform        = espressif32@~8.0.0
board           = esp32dev
framework       = arduino
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
lib_ldf_mode    = chain
lib_extra_dirs  = ../lib
lib_deps        =
    lovyan03/LovyanGFX@^1.2.36
    olikraus/U8g2@^2.36.18
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer
extra_scripts   =
    tools/generate_webui_header.py
    tools/generate_source_bundle.py
    tools/git_commit.py

[env:esp32dev-esp-prog]
extends         = common
debug_tool      = esp-prog
upload_protocol = esp-prog

[env:esp32dev-serial]
extends       = common
debug_tool    = esp-prog
monitor_speed = 115200

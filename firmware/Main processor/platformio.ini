; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs    = esp32dev-ota
extra_configs   =
  *_env.ini
  ../version.ini

[common]
build_flags     =
    -DPRODUCT_VERSION=\"${meta.product_version}\"
    -DCLI_MAX_COMMANDS=32
    -DCLI_INPUT_BUFFER_SIZE=256
    -DCORE_DEBUG_LEVEL=0
    '-DHOSTNAME=${local.hostname}'
    '-DOTA_PASSWORD=${local.ota_password}'
    '-DWIFI_SSID=${local.wifi_ssid}'
    '-DWIFI_PASSWORD=${local.wifi_password}'
platform        = espressif32@~8.0.0
board           = esp32dev
framework       = arduino
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
lib_ldf_mode    = chain
lib_extra_dirs  = ../lib
lib_deps        =
    lovyan03/LovyanGFX@^1.2.36
    olikraus/U8g2@^2.36.18
extra_scripts   =

[env:esp32dev-esp-prog]
extends         = common
debug_tool      = esp-prog
upload_protocol = esp-prog

[env:esp32dev-ota]
extends         = common
debug_tool      = esp-prog
upload_protocol = espota
upload_port     = ${local.hostname}.local
upload_flags    =
    --port=3232
    --auth=${local.ota_password}

[env:esp32dev-serial]
extends       = common
debug_tool    = esp-prog
monitor_speed = 115200
